<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Video Engine</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="wave-bg" aria-hidden="true">
    <svg class="wave wave-back" viewBox="0 0 2400 220" preserveAspectRatio="none"><path d="M0,110 C 200,180 400,40 600,110 C 800,180 1000,40 1200,110 C 1400,180 1600,40 1800,110 C 2000,180 2200,40 2400,110 L2400,220 L0,220 Z"/></svg>
    <svg class="wave wave-mid" viewBox="0 0 2400 220" preserveAspectRatio="none"><path d="M0,130 C 200,60 400,190 600,130 C 800,60 1000,190 1200,130 C 1400,60 1600,190 1800,130 C 2000,60 2200,190 2400,130 L2400,220 L0,220 Z"/></svg>
    <svg class="wave wave-front" viewBox="0 0 2400 220" preserveAspectRatio="none"><path d="M0,150 C 300,90 500,190 800,140 C 1100,90 1300,190 1600,140 C 1900,90 2100,190 2400,140 L2400,220 L0,220 Z"/></svg>
  </div>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark">&#9679;</span>
        <span class="brand-name">Video Engine</span>
      </a>
    </header>

    <main class="stage-area">
      <section class="view card">
        <h1 id="form-title">Sign in</h1>
        <p class="subtitle" id="form-subtitle">Welcome back.</p>

        <form id="auth-form" novalidate>
          <div class="field">
            <label for="email">Email <span class="required">*</span></label>
            <input type="email" id="email" name="email" required autocomplete="email">
          </div>
          <div class="field">
            <label for="password">Password <span class="required">*</span></label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
          </div>

          <button type="submit" id="submit-btn" class="primary-btn">Sign in</button>
          <p id="form-server-error" class="server-error" hidden></p>
          <p id="form-notice" class="subtitle" hidden></p>
        </form>

        <p class="auth-toggle">
          <span id="toggle-text">Don't have an account?</span>
          <button type="button" id="toggle-mode-btn" class="link-btn">Sign up</button>
        </p>
      </section>
    </main>
  </div>

  <script type="module" src="/login.js"></script>
</body>
</html>
